name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'
  push:
    branches:
      - 'master'
      - 'releases/v*'
  pull_request:

jobs:
  dump:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          # Keep supported OS versions and architectures as separate test targets.
          # Ubuntu x64
          - ubuntu-26.04 # renovate: runner
          - ubuntu-24.04
          - ubuntu-22.04
          # Ubuntu arm64
          - ubuntu-26.04-arm # renovate: runner
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
          # macOS arm64
          - xcode-27 # renovate: runner
          - macos-26 # renovate: runner
          - macos-15
          # macOS Intel
          - macos-26-intel # renovate: runner
          - macos-15-intel
          # Windows x64
          - windows-2025 # renovate: runner
          - windows-2022
          # Windows arm64
          - windows-11-arm # renovate: runner
    steps:
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      -
        name: Dump context
        uses: ./
      -
        if: ${{ runner.os == 'Linux' }}
        # run a 2nd time on Linux to see how the action behaves
        # after the 1st run already installed missing dependencies
        name: 2nd Dump context
        uses: ./
